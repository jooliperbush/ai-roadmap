[project]
name = "placeguard"
version = "0.1.0"
description = "Verify, score and value product placements in creator video."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "yt-dlp>=2025.1.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "celery[redis]>=5.4",
  "boto3>=1.34",
]
audio = ["faster-whisper>=1.0"]
gpu = ["torch>=2.3", "transformers>=4.44"]
dev = ["pytest>=8"]

[project.scripts]
placeguard = "placeguard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["placeguard*"]
